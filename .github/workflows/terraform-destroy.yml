#########################################
# Delete some specific resources not complete destroy of resources crated by terraform
name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      target_resource:
        description: "Terraform resource to destroy (optional, e.g. aws_instance.my_ec2)"
        required: false

defaults:
  run:
    working-directory: .   # 👈 root directory

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Terraform Init
        run: terraform init -reconfigure
      - name: Terraform Plan Destroy
        run: |
          if [ -n "${{ github.event.inputs.target_resource }}" ]; then
            terraform plan -destroy -target=${{ github.event.inputs.target_resource }}
          else
            terraform plan -destroy
          fi

  destroy:
    runs-on: ubuntu-latest
    needs: plan
    environment: aws-destroy   # 👈 protect with approval
    steps:
      - uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Terraform Init
        run: terraform init -reconfigure
      - name: Terraform Destroy
        run: |
          if [ -n "${{ github.event.inputs.target_resource }}" ]; then
            terraform destroy -auto-approve -target=${{ github.event.inputs.target_resource }}
          else
            terraform destroy -auto-approve
          fi
