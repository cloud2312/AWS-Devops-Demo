# delete multiple resources at one go in terraform. 

name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      target_resources:
        description: "Comma-separated list of resources to destroy (optional, e.g. aws_instance.my_ec2,aws_s3_bucket.my_bucket)"
        required: false

defaults:
  run:
    working-directory: .   # 👈 root directory

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Terraform Init
        run: terraform init -reconfigure
      - name: Terraform Plan Destroy
        run: |
          if [ -n "${{ github.event.inputs.target_resources }}" ]; then
            TARGET_ARGS=""
            for r in $(echo "${{ github.event.inputs.target_resources}}" | tr "," "\n"); do
              TARGET_ARGS="$TARGET_ARGS -target=$r"
            done
            terraform plan -destroy $TARGET_ARGS
          else
            terraform plan -destroy
          fi

  destroy:
    runs-on: ubuntu-latest
    needs: plan
    environment: aws-destroy   # 👈 protect with approval
    steps:
      - uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Terraform Init
        run: terraform init -reconfigure
      - name: Terraform Destroy
        run: |
          if [ -n "${{ github.event.inputs.target_resources }}" ]; then
            TARGET_ARGS=""
            for r in $(echo "${{ github.event.inputs.target_resources}}" | tr "," "\n"); do
              TARGET_ARGS="$TARGET_ARGS -target=$r"
            done
            terraform destroy -auto-approve $TARGET_ARGS
          else
            terraform destroy -auto-approve
          fi